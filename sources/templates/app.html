<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>SoulTune</title>
    <link rel="stylesheet" href="/static/css/app/style.css">
    <link rel="stylesheet" href="/static/css/app/search.css">
    <link rel="stylesheet" href="/static/css/app/form.css">
    <link rel="stylesheet" href="/static/css/app/playlist.css">
    <link rel="stylesheet" href="/static/css/app/player.css">
    <link rel="stylesheet" href="/static/css/app/albums.css">
    <link rel="shortcut icon" href="/favicon" type="image/x-icon">
</head>

<body>
    <div class="app">
        <div class="sidebar">
            <div class="sidebar-header"
                style="display: flex; flex-direction: row; justify-content: space-around; align-items: center; margin-bottom: 30px;">
                <img src="../static/images/icon.ico" style="width: 50px; height: auto;">
                <h1 style="margin: 0;">SoulTune</h1>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="home">Início</a>
                <a href="#" class="nav-item" data-page="playlists">Suas Playlists</a>
                <a href="#" class="nav-item" data-page="unregistered">Arquivos Não Registrados</a>
                <a href="#" class="nav-item" data-page="settings">Configurações</a>
            </nav>
            <div class="playlists-section">
                <h3>Playlists</h3>
                <ul class="playlist-list">
                </ul>
                <button class="create-playlist-btn">Criar Playlist</button>
            </div>
            <div id="version"></div>
        </div>

        <header class="header">
            <div class="search-bar">
                <input type="text" placeholder="Buscar músicas..." id="search-input">
                <button id="search-btn"><i data-lucide="search"></i></button>
            </div>
        </header>

        <div class="main-content">

            <section class="albums-section">
                <h2 id="secao-titulo"></h2>
                <div class="albums-grid" id="albums-grid"></div>
            </section>

            <section class="playlist-view" id="playlist-view" style="display: none;">
                <div class="playlist-header">
                    <img src="" alt="" class="playlist-cover" id="playlist-cover">
                    <div class="playlist-info">
                        <h2 id="playlist-title"></h2>
                        <p id="playlist-description"></p>
                    </div>
                </div>
                <div class="track-list" id="track-list">
                </div>
            </section>

            <section class="settings-view" id="settings-view" style="display: none;">
                <div class="settings-container">
                    <h2>Configurações</h2>
                    
                    <div class="settings-group">
                        <h3>Discord</h3>
                        <div class="settings-item">
                            <label class="setting-label">
                                <input type="checkbox" id="discord-rpc" class="setting-checkbox">
                                <span>Exibir no Discord (RPC)</span>
                            </label>
                        </div>
                    </div>

                    <div class="settings-group">
                        <h3>Pastas de Música</h3>
                        <div class="settings-item">
                            <label class="setting-label">Caminho da pasta de Undertale</label>
                            <div class="path-input-group">
                                <input type="text" id="undertale-path" class="setting-path" placeholder="Selecione uma pasta..." readonly>
                                <button id="undertale-browse" class="browse-btn" data-lucide="folder-open"></button>
                            </div>
                        </div>
                        <div class="settings-item">
                            <label class="setting-label">Caminho da pasta de Deltarune</label>
                            <div class="path-input-group">
                                <input type="text" id="deltarune-path" class="setting-path" placeholder="Selecione uma pasta..." readonly>
                                <button id="deltarune-browse" class="browse-btn" data-lucide="folder-open"></button>
                            </div>
                        </div>
                    </div>

                    <div class="settings-group">
                        <h3>Sistema</h3>
                        <div class="settings-item">
                            <label class="setting-label">
                                <input type="checkbox" id="auto-start" class="setting-checkbox">
                                <span>Iniciar ao abrir Windows</span>
                            </label>
                        </div>
                    </div>

                    <div class="settings-group">
                        <h3>Customização</h3>
                        <div class="settings-item">
                            <span>Tema de aplicativo</span>
                            <label class="setting-label">
                                <select id="ui-theme" class="setting-select">
                                    <option value="0">Moderno</option>
                                    <option value="1">Undertale/Deltarune</option>
                                </select>
                            </label>
                        </div>
                    </div>
                    
                    <div class="settings-group">
                        <h3>Desenvolvedor</h3>
                        <div class="settings-item">
                            <a href="/dev" target="_self"><button class="setting-button">Página de Desenvolvedor</button></a>
                        </div>
                        <div class="settings-item">
                            <a href="https://github.com/LucaCunha001/SoulTune/"><button class="setting-button">Ver Repositório</button></a>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div id="right-panel" class="right-panel">
        <div id="album-content"></div>
        <div id="lyrics-content"></div>
    </div>
    </div>

    <div class="player">
        <div class="player-controls">
            <button id="prev-btn"><i data-lucide="skip-back"></i></button>
            <button id="play-pause-btn"><i data-lucide="play"></i></button>
            <button id="next-btn"><i data-lucide="skip-forward"></i></button>
            <button id="loop-btn"><i data-lucide="repeat"></i></button>
        </div>
        <div class="player-progress">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" min="0" max="100" value="0">
            <span id="total-time">0:00</span>
        </div>
        <div class="player-volume">
            <span><i data-lucide="volume"></i></span>
            <input type="range" id="volume-bar" min="0" max="100" value="50">
        </div>
        <div class="now-playing">
            <img src="../static/images/icon.ico" alt="" class="current-track-cover" id="current-track-cover">
            <div class="track-info">
                <p id="current-track-title"></p>
                <p id="current-track-artist"></p>
            </div>
        </div>
    </div>

    <div id="playlist-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Criar Nova Playlist</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form id="playlist-form">
                <div class="form-group">
                    <label for="playlist-name">Nome da Playlist *</label>
                    <input type="text" id="playlist-name" placeholder="Digite o nome..." required>
                </div>
                <div class="form-group">
                    <label for="playlist-description">Descrição</label>
                    <textarea id="playlist-description" placeholder="Adicione uma descrição (opcional)..." rows="3"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btn-cancel">Cancelar</button>
                    <button type="submit" class="btn-create">Criar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../static/js/lucide.min.js"></script>
    <script type="module" src="../static/js/app.js"></script>
</body>

</html>
