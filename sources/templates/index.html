<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulTune - Inicializando</title>
    <link rel="shortcut icon" href="/favicon" type="image/x-icon">

    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            color: #fff;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            width: 400px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .status {
            font-size: 14px;
            opacity: 0.8;
        }

        .bar {
            margin-top: 20px;
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #e02424;
            transition: width 0.3s;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
            font-size: 14px;
            min-width: 100px;
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.03);
        }

        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #e02424;
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: #ff3b3b;
        }

        .btn-secondary {
            background: #151515;
            color: #ddd;
            border: 1px solid #888;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #1f1f1f;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>SoulTune</h1>
        <div class="status" id="status">Iniciando...</div>

        <div class="bar">
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <script src="../static/js/updating.js"></script>
</body>

</html>
